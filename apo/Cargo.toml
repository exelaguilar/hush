[package]
name = "hush-apo"
version = "1.0.1"
edition = "2021"
description = "Hush clean-mic Audio Processing Object (loaded by Windows' audio engine)"
authors = ["Exel (https://exel.dev)"]
license = "MIT"
publish = false

[lib]
name = "hush_apo"
# cdylib: the DLL audiodg.exe loads. rlib: lets the app and tests reuse the DSP
# chain and the settings format.
crate-type = ["cdylib", "rlib"]

[dependencies]
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"] }
memmap2 = "0.9"
ndarray = "0.15"
nnnoiseless = { version = "0.5.2", default-features = false }
rtrb = "0.3"
rubato = "0.14"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Apo",
    "Win32_System_Com",
    "Win32_System_EventLog",
    "Win32_System_Threading",
    "Win32_Security",
] }
