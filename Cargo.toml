[workspace]
members = ["apo", "installer"]
# The installer embeds release binaries; build it via package.ps1.
default-members = [".", "apo"]

[package]
name = "hush"
version = "1.1.0"
edition = "2021"
description = "Lightweight clean-microphone app for Windows (noise removal, voice gate, voice EQ)"
authors = ["Exel (https://exel.dev)"]
license = "MIT"
repository = "https://github.com/exelaguilar/hush"
publish = false

[dependencies]
anyhow = "1.0"
cpal = "0.15"
hound = "3.5"

hush-apo = { path = "apo" }
rtrb = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
tray-icon = "0.19"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Networking_WinHttp", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"


# DeepFilterNet (tract) is far too slow unoptimized; optimize dependencies
# even in debug/test builds so the real-time tests are meaningful.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
# unwind (not abort): a panic inside the APO must be caught, not kill audiodg.exe
panic = "unwind"
strip = true

# The installer's build script brotli-compresses the payload; unoptimized it
# takes minutes.
[profile.release.build-override]
opt-level = 3

[[bin]]
name = "hush"
path = "src/main.rs"

[[bin]]
name = "hush-diag"
path = "src/bin/hush-diag.rs"

[[bin]]
name = "hush-setup"
path = "src/bin/hush-setup.rs"

[build-dependencies]
winresource = "0.1"
