name: Release

# Push a tag such as v1.0.1 to build the installer and publish it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_OPT_LEVEL: "3"

# The release build and the tests run in parallel (each with its own
# cache, like CI); the release is published only when both pass.
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      hash: ${{ steps.package.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Check the tag matches Cargo.toml
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi
          for manifest in apo/Cargo.toml installer/Cargo.toml; do
            package_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -n 1)"
            if [ "$version" != "$package_version" ]; then
              echo "::error::$manifest version $package_version does not match the tag"
              exit 1
            fi
          done
          rustc -Vv
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build application and APO payloads
        run: |
          cargo build --locked --release -p hush --bin hush --bin hush-setup
          cargo build --locked --release -p hush-apo

      - name: Build installer
        env:
          SM_PAYLOAD_DIR: ${{ github.workspace }}\target\release
        run: cargo build --locked --release -p hush-installer

      - name: Test installer
        env:
          SM_PAYLOAD_DIR: ${{ github.workspace }}\target\release
          __COMPAT_LAYER: RunAsInvoker
        run: cargo test --locked --release -p hush-installer

      - name: Package and checksum
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          name="Hush-Setup-$VERSION.exe"
          cp target/release/hush-installer.exe "dist/$name"
          hash="$(sha256sum "dist/$name" | cut -d ' ' -f 1 | tr 'A-F' 'a-f')"
          printf '%s  %s\n' "$hash" "$name" > "dist/Hush-Setup-$VERSION.sha256"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/
          if-no-files-found: error

  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Test workspace
        run: cargo test --locked --workspace --exclude hush-installer --all-targets

      - name: Compare unchanged settings with the 1.2.0 DSP baseline
        run: ./tools/check-pcm.ps1 -Baseline v1.2.0

  publish:
    permissions:
      contents: write
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist/

      - name: Verify downloaded release assets
        env:
          VERSION: ${{ needs.build.outputs.version }}
          HASH: ${{ needs.build.outputs.hash }}
        run: |
          name="Hush-Setup-$VERSION.exe"
          actual="$(sha256sum "dist/$name" | cut -d ' ' -f 1)"
          test "$actual" = "$HASH"
          test "$(cat "dist/Hush-Setup-$VERSION.sha256")" = "$HASH  $name"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
          HASH: ${{ needs.build.outputs.hash }}
        run: |
          # Take the "## <version>" section, stop at the next "## ", and join
          # hard-wrapped continuation lines (two leading spaces) to their bullet.
          awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              title = substr($0, 4)
              if (title == ver || index(title, ver " ") == 1 || index(title, ver " -") == 1) { found = 1 }
              next
            }
            found { print }
          ' CHANGELOG.md | sed 's/\r$//' | awk '
            /^  +[^ ]/ && out != "" { sub(/^ +/, ""); out = out " " $0; next }
            { if (started) print out; out = $0; started = 1 }
            END { if (started) print out }
          ' | cat -s > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No CHANGELOG.md section found for $VERSION"
            exit 1
          fi
          printf '\nSHA-256: `%s  Hush-Setup-%s.exe`\n' "$HASH" "$VERSION" >> notes.md
          cat notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          files=("dist/Hush-Setup-$VERSION.exe" "dist/Hush-Setup-$VERSION.sha256")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run may only add assets an interrupted run did not upload.
            # Anything already published must match this build byte for byte.
            mkdir verified-release
            published="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
            missing=()
            for file in "${files[@]}"; do
              name="$(basename "$file")"
              if grep -qxF "$name" <<< "$published"; then
                gh release download "$GITHUB_REF_NAME" --pattern "$name" --dir verified-release
                if ! cmp --silent "$file" "verified-release/$name"; then
                  echo "::error::Published $name differs from this build. Publish a new version instead."
                  exit 1
                fi
              else
                missing+=("$file")
              fi
            done
            if [ "${#missing[@]}" -gt 0 ]; then
              gh release upload "$GITHUB_REF_NAME" "${missing[@]}"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Hush $VERSION" --notes-file notes.md --verify-tag
          fi
