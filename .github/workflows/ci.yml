name: CI

on:
  push:
  pull_request:

# A newer push to the same ref supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The installer's build script compresses its payload; keep it fast.
  CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_OPT_LEVEL: "3"

# Two jobs in parallel, each with its own cache: the release build (what
# ships) and the debug-profile tests plus clippy.
jobs:
  release-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Build application and APO payloads
        run: |
          cargo build --locked --release -p hush --bin hush --bin hush-setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release -p hush-apo

      - name: Build installer
        env:
          SM_PAYLOAD_DIR: ${{ github.workspace }}\target\release
        run: cargo build --locked --release -p hush-installer

      # --release reuses the optimized build script, so the payload is not
      # recompressed by an unoptimized brotli.
      - name: Test installer
        env:
          SM_PAYLOAD_DIR: ${{ github.workspace }}\target\release
          # The installer's manifest asks for elevation; the test exe must not.
          __COMPAT_LAYER: RunAsInvoker
        run: cargo test --locked --release -p hush-installer

  test:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Test workspace
        run: cargo test --locked --workspace --exclude hush-installer --all-targets

      - name: Clippy
        run: cargo clippy --locked --workspace --exclude hush-installer --all-targets -- -D warnings
